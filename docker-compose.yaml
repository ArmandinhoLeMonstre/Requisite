services:
  db:
    image: postgres:18
    container_name: db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
  api:
    build:
      context: ./api
    container_name: api
    ports:
      - "8080:80"
    volumes:
      - ./api:/app
    env_file:
      - ".env"
    user: "${UID}:${GID}"
